      const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

      document.getElementById('f').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const btn = document.getElementById('b');
        const err = document.getElementById('e');
        btn.disabled = true; err.textContent = ''; btn.textContent = '復号中…';
        try {
          const base = await crypto.subtle.importKey(
            'raw', new TextEncoder().encode(document.getElementById('p').value),
            'PBKDF2', false, ['deriveKey']);
          const key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: bytes(DATA.salt), iterations: DATA.iterations, hash: 'SHA-256' },
            base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
          /* 密码错 → AES-GCM 的认证标签校验失败 → 直接抛异常。
             不需要额外存「密码是否正确」的标记，也就没法被绕过。 */
          const plain = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: bytes(DATA.iv) }, key, bytes(DATA.cipher));
          const html = new TextDecoder().decode(plain);
          document.open(); document.write(html); document.close();
        } catch {
          err.textContent = 'パスワードが違います';
          btn.disabled = false; btn.textContent = '開く';
        }
